name: Build

# Triggered by the sync pipeline (see sync-cloudflared.yaml) right after it
# publishes the release for "upstream tag + BSD patch". Every leg checks out the
# tag the release points at, i.e. the patched commit, not upstream's tag.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # cloudflared's go.mod now carries a full patch-level directive
  # (`go 1.27.3`), and the go command refuses to build with anything older.
  # This must be kept in sync with upstream's go.mod, bump it on every sync
  # failure of the form "go.mod requires go >= 1.xx.y".
  GO_VERSION: "1.27.3"

# `gh release upload` below writes to the release, so the token needs write
# access even though the job only reads the repository.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, freebsd, netbsd, openbsd]
    # The BSD legs only need a Linux host to boot the VM.
    runs-on: ${{ contains(matrix.os, 'bsd') && 'ubuntu-latest' || matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Resolve latest release tag
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo
            });
            core.setOutput('tag_name', data.tag_name);

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_release.outputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      # ---------------------------------------------------------------------
      # Native runners
      # ---------------------------------------------------------------------
      - name: Install Go ${{ env.GO_VERSION }}
        if: ${{ !contains(matrix.os, 'bsd') }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build on ${{ matrix.os }}
        if: ${{ !contains(matrix.os, 'bsd') }}
        run: make cloudflared

      # ---------------------------------------------------------------------
      # BSD: no official GitHub runner, so boot a VM. The distro `go` package is
      # always older than upstream's go.mod directive, therefore the official
      # tarball is used for all three BSDs.
      # ---------------------------------------------------------------------
      - name: Build for FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          envs: "GO_VERSION CGO_ENABLED"
          usesh: true
          mem: 4096
          prepare: |
            pkg install -y gmake sudo bash git curl ca_root_nss
            git config --global --add safe.directory "$PWD"
          run: |
            curl -fsSL -o /tmp/go.tgz "https://go.dev/dl/go${GO_VERSION}.freebsd-amd64.tar.gz"
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
            export PATH=/usr/local/go/bin:$PATH
            go version
            gmake cloudflared

      - name: Build for NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          envs: "GO_VERSION CGO_ENABLED"
          usesh: true
          mem: 4096
          prepare: |
            export PATH=/sbin:/usr/sbin:/bin:/usr/bin:/usr/pkg/sbin:/usr/pkg/bin:$PATH
            PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r | cut -f '1 2' -d.)/All/"
            export PKG_PATH
            pkg_add -U pkgin pkg_alternatives
            pkgin update
            pkgin -y install gmake sudo bash git curl ca-certificates
            pkg_alternatives rebuild
            git config --global --add safe.directory "$PWD"
          run: |
            curl -fsSL -o /tmp/go.tgz "https://go.dev/dl/go${GO_VERSION}.netbsd-amd64.tar.gz"
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
            export PATH=/usr/local/go/bin:/usr/pkg/bin:$PATH
            go version
            gmake cloudflared

      - name: Build for OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.7"
          envs: "GO_VERSION CGO_ENABLED"
          usesh: true
          mem: 4096
          prepare: |
            pkg_add -xaz gmake sudo-- bash git curl
            git config --global --add safe.directory "$PWD"
          run: |
            curl -fsSL -o /tmp/go.tgz "https://go.dev/dl/go${GO_VERSION}.openbsd-amd64.tar.gz"
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
            export PATH=/usr/local/go/bin:$PATH
            go version
            gmake cloudflared

      # ---------------------------------------------------------------------
      # Publish the artifact of this leg
      # ---------------------------------------------------------------------
      - name: Authenticate GH CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Upload windows build to GitHub Release
        if: contains(matrix.os, 'windows')
        shell: pwsh
        run: |
          Compress-Archive -Path .\cloudflared.exe -DestinationPath cloudflared-${{ matrix.os }}-amd64.zip
          gh release upload "${{ steps.get_release.outputs.tag_name }}" cloudflared-${{ matrix.os }}-amd64.zip --clobber

      - name: Upload ${{ matrix.os }} build to GitHub Release
        if: ${{ !contains(matrix.os, 'windows') }}
        run: |
          tar -czvf cloudflared-${{ matrix.os }}-amd64.tar.gz cloudflared
          gh release upload "${{ steps.get_release.outputs.tag_name }}" cloudflared-${{ matrix.os }}-amd64.tar.gz --clobber
