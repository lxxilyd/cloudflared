name: Sync cloudflared Release

# Replaces the old "merge origin/custom/patch into the new upstream tag" flow.
#
# Why: merging a branch whose merge-base is a year old leaves conflict markers in
# the tree, and `git add -A && git commit` stores them, so the release branch only
# fails later inside the build. On top of that the old flow re-checked out a
# complete stale Makefile from the patch branch, which reverted upstream's move
# away from `-mod=vendor` and broke every build after the vendor/ directory was
# removed.
#
# New flow (no merge, no conflict markers, verified before publishing):
#   1. check out pristine upstream tag
#   2. run custom/bsd/apply.sh (overlay + build tags + Makefile netbsd)
#   3. cross-compile for freebsd/openbsd/netbsd - fail here, not in the release
#   4. push release/<tag> and publish the GitHub release

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to sync (empty = latest)'
        required: false
      force:
        description: 'Rebuild an existing release/<tag> branch'
        type: boolean
        default: false

concurrency:
  group: sync-cloudflared
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      # Keep in sync with .github/workflows/build.yaml and upstream's go.mod.
      GO_VERSION: "1.27.3"
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve upstream release
        id: upstream
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          fi
          case "$tag" in
            [0-9][0-9][0-9][0-9].*) ;;
            *) echo "unexpected tag: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "resolved upstream tag: $tag"

      - name: Check whether this release already exists
        id: check
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/release/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release/${TAG} already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release branch from upstream tag + BSD patch
        id: build_branch
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # The patch set lives on the default branch, so stash it before moving
          # the working tree onto the upstream tag.
          rm -rf /tmp/bsd && cp -R custom/bsd /tmp/bsd

          git remote add upstream https://github.com/cloudflare/cloudflared.git
          git fetch --depth=1 upstream "refs/tags/${TAG}:refs/tags/upstream-${TAG}"
          git checkout -B "release/${TAG}" "upstream-${TAG}"

          # Upstream CI must not run against our branch.
          rm -rf .github/workflows

          mkdir -p custom
          cp -R /tmp/bsd custom/bsd
          sh ./custom/bsd/apply.sh

          # Gate: the patch is worthless if the result does not compile for the
          # BSDs. Cross-compiling from Linux is enough because CGO is disabled.
          for os in freebsd openbsd netbsd; do
            echo "::group::cross-build ${os}/amd64"
            GOOS="$os" GOARCH=amd64 go build -mod=readonly ./cmd/cloudflared
            rm -f cloudflared
            echo "::endgroup::"
          done
          echo "::group::cross-build freebsd/arm64"
          GOOS=freebsd GOARCH=arm64 go build -mod=readonly ./cmd/cloudflared
          rm -f cloudflared
          echo "::endgroup::"

          # The patch sources are not part of the shipped tree.
          rm -rf custom

          git add -A
          git commit -m "sync: apply custom BSD patch on ${TAG}"
          git push --force-with-lease origin "release/${TAG}"

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.build_branch.outputs.pushed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            Automated build of cloudflared **${{ env.TAG }}**

            Stock upstream source with the BSD tweaks from `custom/bsd` (applied on top of the pristine tag, see `sync-cloudflared.yaml`).
          draft: false
          prerelease: false
          target_commitish: release/${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Events fired with GITHUB_TOKEN do not start new workflow runs, so the
      # build has to be dispatched explicitly with a PAT.
      - name: Trigger build workflow
        if: steps.build_branch.outputs.pushed == 'true'
        run: |
          gh workflow run "Build" --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ secrets.PTA_TOKEN }}
